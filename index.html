<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0b14" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Swole: a free, offline gym log." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Swole</title>
    <script>
      // Apply the saved theme before the first paint so there is no flash.
      try {
        var t = localStorage.getItem('swole.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
